<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Plutus — personal finance management. Track spending, budgets, and investments in one place." />
    <meta name="theme-color" content="#0B0E2A" />

    <!-- Security headers for Google Sign-In -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Plutus" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Plutus</title>
    <link rel="manifest" href="manifest.json" />

    <!-- Branded loading splash, removed once Flutter renders its first frame -->
    <style>
      #plutus-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0B0E2A;
        transition: opacity 0.35s ease-out;
      }
      #plutus-splash img {
        width: min(45vw, 260px);
        height: auto;
      }
      #plutus-splash-bar {
        width: 160px;
        height: 2px;
        margin-top: 24px;
        background: rgba(201, 151, 15, 0.25);
        overflow: hidden;
        border-radius: 1px;
      }
      #plutus-splash-bar > div {
        width: 40%;
        height: 100%;
        background: #C9970F;
        border-radius: 1px;
        animation: plutus-splash-sweep 1.2s ease-in-out infinite;
      }
      @keyframes plutus-splash-sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="plutus-splash"><img src="splash_logo.png" alt="Plutus" /><div id="plutus-splash-bar"><div></div></div></div>
    <script>
      (function () {
        function hideSplash() {
          var splash = document.getElementById("plutus-splash");
          if (!splash) return;
          splash.style.opacity = "0";
          setTimeout(function () {
            splash.remove();
          }, 400);
        }
        window.addEventListener("flutter-first-frame", hideSplash);
        // Safety net: never let the splash mask a failed boot forever.
        setTimeout(hideSplash, 20000);
      })();
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
