version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing Flutter dependencies..."
        - if [ ! -d flutter ]; then git clone https://github.com/flutter/flutter.git --depth 1 -b stable; fi
        - export PATH=$PATH:$PWD/flutter/bin
        - flutter pub get
    build:
      commands:
        - echo "Building Flutter web application..."
        - flutter build web --release --dart-define=FLUTTER_WEB_AUTO_DETECT=true --dart-define=REDIRECT_URL=https://main.d3adjr6i7jedcz.amplifyapp.com --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID --dart-define=GOOGLE_ANDROID_CLIENT_ID=$GOOGLE_ANDROID_CLIENT_ID --dart-define=GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cross-Origin-Opener-Policy'
          value: 'same-origin-allow-popups'
        - key: 'Cross-Origin-Embedder-Policy'
          value: 'unsafe-none'

