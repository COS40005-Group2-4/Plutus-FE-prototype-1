version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing Flutter dependencies..."
        - if [ ! -d flutter ]; then git clone https://github.com/flutter/flutter.git --depth 1 -b stable; fi
        - export PATH=$PATH:$PWD/flutter/bin
        - echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" > app.env
        - echo "GOOGLE_ANDROID_CLIENT_ID=$GOOGLE_ANDROID_CLIENT_ID" >> app.env
        - echo "GOOGLE_DESKTOP_CLIENT_ID=$GOOGLE_DESKTOP_CLIENT_ID" >> app.env
        - echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> app.env
        - echo "GOOGLE_DESKTOP_CLIENT_SECRET=$GOOGLE_DESKTOP_CLIENT_SECRET" >> app.env
        - echo "REDIRECT_URL=$REDIRECT_URL" >> app.env
        - echo "PLUTUS_AWS_ACCESS_KEY_ID=$PLUTUS_AWS_ACCESS_KEY_ID" >> app.env
        - echo "PLUTUS_AWS_SECRET_ACCESS_KEY=$PLUTUS_AWS_SECRET_ACCESS_KEY" >> app.env
        - echo "PLUTUS_AWS_SESSION_TOKEN=$PLUTUS_AWS_SESSION_TOKEN" >> app.env
        - echo "PLUTUS_AWS_REGION=$PLUTUS_AWS_REGION" >> app.env
        - echo "PLUTUS_AWS_S3_BUCKET_NAME=$PLUTUS_AWS_S3_BUCKET_NAME" >> app.env
        - echo "PLUTUS_DYNAMO_TC_TABLE_NAME=$PLUTUS_DYNAMO_TC_TABLE_NAME" >> app.env
        - echo "EXCHANGE_RATE_API_KEY=$EXCHANGE_RATE_API_KEY" >> app.env
        - echo "COINGECKO_API_KEY=$COINGECKO_API_KEY" >> app.env
        - echo "ALPHA_VANTAGE_API_KEY=$ALPHA_VANTAGE_API_KEY" >> app.env
        - echo "AI_API_GATEWAY_URL=$AI_API_GATEWAY_URL" >> app.env
        - echo "AI_API_KEY=$AI_API_KEY" >> app.env
        - flutter clean
        - flutter pub get
        - flutter pub upgrade
    build:
      commands:
        - echo "Building Flutter web application..."
        - flutter build web --release --no-tree-shake-icons --source-maps --dart-define=FLUTTER_WEB_AUTO_DETECT=true --dart-define-from-file=app.env
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
