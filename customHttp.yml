customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Cross-Origin-Opener-Policy'
        value: 'unsafe-none'
      - key: 'Cross-Origin-Embedder-Policy'
        value: 'unsafe-none'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
